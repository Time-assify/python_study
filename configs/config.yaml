# AI Engineer Training Platform Configuration

deepseek:
  api_key: ${DEEPSEEK_API_KEY}  # Use environment variable
  model: deepseek-chat

system:
  language: zh
  default_day: 1
  max_submissions_per_day: 5

evaluation:
  # Scoring logic is defined in TrainingPlatform._calculate_final_score:
  #   syntax/execution/timeout failure -> 0
  #   test_score < 60                  -> final = test_score
  #   test_score >= 60 and AI ok       -> 70% test + 30% AI
  #   AI unavailable / invalid         -> final = test_score
  passing_score: 60
  excellent_score: 90

paths:
  tasks_dir: tasks
  submissions_dir: submissions
  tests_dir: tests
  reports_dir: reports
  database_path: data/progress.db